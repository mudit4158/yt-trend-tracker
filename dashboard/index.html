<title>Roz Trend Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Mukta:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F3F4F7; --surface:#FFFFFF; --sunk:#E9EBF1; --ink:#1A2036; --ink-2:#4A5270; --ink-3:#7A819C;
  --line:#D9DCE6; --accent:#C8641A; --accent-soft:#FBE9DA;
  --dev:#C8641A; --dev-soft:#FBE9DA; --kid:#12877A; --kid-soft:#D8F1EC; --tfn:#4453C9; --tfn-soft:#E2E5FA;
  --ok:#1E8A4C; --ok-soft:#DDF3E5; --warn:#A96A00; --warn-soft:#FBEFD2; --bad:#B8322C; --bad-soft:#F8DEDC;
  --display:"Baloo 2","Mukta",system-ui,sans-serif; --body:"Mukta",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --ground:#11141D; --surface:#191D29; --sunk:#222736; --ink:#E7E9F2; --ink-2:#B3B8CC; --ink-3:#848AA3; --line:#2E3446;
  --accent:#F0934A; --accent-soft:#3A2717; --dev:#F0934A; --dev-soft:#3A2717; --kid:#3FC1B0; --kid-soft:#12302C;
  --tfn:#8D98F2; --tfn-soft:#23284A; --ok:#5ACB88; --ok-soft:#163223; --warn:#E3AE48; --warn-soft:#352914; --bad:#EE7B73; --bad-soft:#3B1C1B;}}
:root[data-theme="dark"]{color-scheme:dark;
  --ground:#11141D; --surface:#191D29; --sunk:#222736; --ink:#E7E9F2; --ink-2:#B3B8CC; --ink-3:#848AA3; --line:#2E3446;
  --accent:#F0934A; --accent-soft:#3A2717; --dev:#F0934A; --dev-soft:#3A2717; --kid:#3FC1B0; --kid-soft:#12302C;
  --tfn:#8D98F2; --tfn-soft:#23284A; --ok:#5ACB88; --ok-soft:#163223; --warn:#E3AE48; --warn-soft:#352914; --bad:#EE7B73; --bad-soft:#3B1C1B;}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1240px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:14px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
h1{font:700 26px/1.1 var(--display);margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--ink-2);font-size:14px}
select,input[type=text],input[type=url],input[type=search]{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
button{font:500 14px var(--body);cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px}
button:hover{border-color:var(--ink-3)} button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
nav.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--ink-2);white-space:nowrap;font-weight:600}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-top:20px}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 12px/1 var(--body);padding:4px 8px;border-radius:99px;background:var(--sunk);color:var(--ink-2);white-space:nowrap;letter-spacing:.02em}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.DEV{background:var(--dev-soft);color:var(--dev)} .chip.KID{background:var(--kid-soft);color:var(--kid)} .chip.TFN{background:var(--tfn-soft);color:var(--tfn)}
.label{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
h2{font:700 20px/1.2 var(--display);margin:0;text-wrap:balance}
h3{font:600 16px/1.3 var(--body);margin:0}
.muted{color:var(--ink-3)} .small{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px}
.summary p{margin:0;max-width:75ch}
.alerts{display:flex;flex-wrap:wrap;gap:8px}
.alert{display:flex;gap:8px;align-items:baseline;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:14px}
.alert b{color:var(--warn)} .alert.hot{background:var(--bad-soft)} .alert.hot b{color:var(--bad)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:980px){.cols{grid-template-columns:1fr}}
.col-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px;border-bottom:2px solid var(--c,var(--line))}
.col[data-ch=DEV]{--c:var(--dev)} .col[data-ch=KID]{--c:var(--kid)} .col[data-ch=TFN]{--c:var(--tfn)}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.card .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card .ttl{font-weight:600;font-size:16px;line-height:1.35}
.score{font:500 13px var(--mono);color:var(--ink-2)}
details.more summary{cursor:pointer;color:var(--ink-2);font-size:14px;list-style:none}
details.more summary::before{content:"＋ ";color:var(--accent)} details.more[open] summary::before{content:"－ "}
.kv{display:grid;gap:10px;margin-top:10px;font-size:14px}
.kv > div > .label{display:block;margin-bottom:2px}
.kv ul,.kv ol{margin:0;padding-left:18px}
.kv pre{white-space:pre-wrap;font:13px/1.45 var(--mono);background:var(--sunk);padding:8px 10px;border-radius:8px;margin:0;overflow-x:auto}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.actions input{flex:1 1 160px}
.copy{font-size:12px;padding:2px 8px}
.empty{padding:28px;text-align:center;color:var(--ink-3);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters input[type=search]{flex:1 1 220px}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);background:var(--sunk);position:sticky;top:0;white-space:nowrap}
td.r,th.r{text-align:right} tr:last-child td{border-bottom:0}
td a{color:var(--ink);text-decoration:none} td a:hover{text-decoration:underline;color:var(--accent)}
.tt{max-width:420px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px;align-items:baseline}
.list li .big{font:500 13px var(--mono);color:var(--accent);min-width:54px;text-align:right}
.list li a{color:var(--ink)}
.bar{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:5px}
.hours{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;align-items:end;height:90px}
.hours div{background:var(--accent);border-radius:2px 2px 0 0;min-height:2px}
.hours-x{display:grid;grid-template-columns:repeat(24,1fr);font:10px var(--mono);color:var(--ink-3);text-align:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.cal{display:grid;gap:8px}
.cal .ev{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.cal .d{font:700 22px/1 var(--display);text-align:center}
.cal .d small{display:block;font:500 11px var(--body);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:14px;z-index:9}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Roz <span>Trend</span> Desk</h1>
      <div class="meta">
        <label class="small muted" for="dateSel">Day</label>
        <select id="dateSel"></select>
        <span id="runChip" class="chip">Loading…</span>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="brief" aria-selected="true">Today's Brief</button>
      <button role="tab" data-tab="tracker" aria-selected="false">Top 500</button>
      <button role="tab" data-tab="channels" aria-selected="false">Channel Pulse</button>
      <button role="tab" data-tab="web" aria-selected="false">Web Pulse</button>
      <button role="tab" data-tab="calendar" aria-selected="false">Calendar</button>
      <button role="tab" data-tab="ledger" aria-selected="false">Ideas Ledger</button>
      <button role="tab" data-tab="patterns" aria-selected="false">Patterns</button>
    </nav>
  </header>

  <main>
    <section id="tab-brief" class="stack"></section>
    <section id="tab-tracker" hidden></section>
    <section id="tab-channels" hidden></section>
    <section id="tab-web" hidden></section>
    <section id="tab-calendar" hidden></section>
    <section id="tab-ledger" hidden></section>
    <section id="tab-patterns" hidden></section>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const CH = {DEV:"Devotional", KID:"Kids", TFN:"Tech + Finance"};
const STATUS = ["Suggested","Accepted","In production","Published","Rejected","Expired"];
const S = {db:null, meta:null, date:null, ideas:[], day:{}, calendar:null, tab:"brief", chan:"DEV", pscope:"tracker_top500",
           tf:{q:"",cat:"",lang:"",fmt:"",len:""}, lf:{ch:"",st:"open"}};
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fmt(n){ if(n==null||isNaN(n)) return "–"; const a=Math.abs(n);
  if(a>=1e7) return (n/1e7).toFixed(a>=1e8?0:1)+" Cr"; if(a>=1e5) return (n/1e5).toFixed(a>=1e6?0:1)+" L";
  if(a>=1e3) return (n/1e3).toFixed(a>=1e4?0:1)+"K"; return String(Math.round(n)); }
function dur(s){ if(!s) return "–"; const m=Math.floor(s/60), h=Math.floor(m/60); return h? `${h}h ${m%60}m` : `${m}:${String(s%60).padStart(2,"0")}`; }
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2200); }
function dshort(iso){ const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"}); }
const yt = id => `https://www.youtube.com/watch?v=${encodeURIComponent(id)}`;
const LANG = {hi:"Hindi",latin:"Eng/Hinglish",en:"English",ta:"Tamil",te:"Telugu",kn:"Kannada",ml:"Malayalam",bn:"Bengali",pa:"Punjabi",gu:"Gujarati",mr:"Marathi",or:"Odia",ur:"Urdu"};

/* ---------- tabs ---------- */
$("#tabs").addEventListener("click", e => { const b=e.target.closest("button[data-tab]"); if(!b) return; setTab(b.dataset.tab); });
function setTab(t){ S.tab=t; document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===t));
  document.querySelectorAll("main > section").forEach(s=>s.hidden = s.id!=="tab-"+t); try{localStorage.setItem("rtd.tab",t)}catch(e){} render(); }
$("#dateSel").addEventListener("change", e => loadDay(e.target.value));

/* ---------- data ---------- */
async function boot(){
  try{ const t=localStorage.getItem("rtd.tab"); if(t && $("#tab-"+t)) S.tab=t; }catch(e){}
  setTab(S.tab);
  const db = window.claude?.use ? await window.claude.use("db") : null;
  if(!db){ $("#runChip").textContent="Database not available in this view"; $("#runChip").className="chip bad"; render(); return; }
  S.db = db;
  db.collection("runs").orderBy("date","desc").limit(60).onSnapshot(snap => {
    const runs = snap.docs.map(d=>d.data());
    S.meta = runs.length ? {runs:Object.fromEntries(runs.map(r=>[r.date,r])), dates:runs.map(r=>r.date)} : null;
    const dates = (S.meta?.dates || []).slice().sort().reverse();
    $("#dateSel").innerHTML = dates.map(d=>`<option value="${d}">${dshort(d)} ${d===dates[0]?"(latest)":""}</option>`).join("") || `<option>No runs yet</option>`;
    const want = S.date && dates.includes(S.date) ? S.date : dates[0];
    if(want){ $("#dateSel").value = want; if(want!==S.date || !S.day.loaded) loadDay(want); }
    runChip(); render();
  }, err => { $("#runChip").textContent="Could not load: "+err.code; $("#runChip").className="chip bad"; });
  db.collection("ideas").onSnapshot(snap => { S.ideas = snap.docs.map(d=>({_id:d.id, ...d.data()})); render(); },
    err => toast("Ideas could not load ("+err.code+")"));
  db.collection("calendar").orderBy("date","desc").limit(1).onSnapshot(snap => { S.calendar = snap.empty ? null : snap.docs[0].data(); render(); });
}
async function loadDay(date){
  S.date=date; S.day={loaded:false};
  const db=S.db, parts=[1,2,3,4,5];
  const [areas,pulse,patterns,topics,...tr] = await Promise.all([
    db.doc(`areas/${date}`).get(), db.doc(`pulse/${date}`).get(), db.doc(`patterns/${date}`).get(), db.doc(`topics/${date}`).get(),
    ...parts.map(p=>db.doc(`tracker/${date}_${p}`).get())
  ].map(p=>p.catch(()=>({exists:false}))));
  if(S.date!==date) return;
  S.day = {loaded:true, areas:areas.exists?areas.data():null, pulse:pulse.exists?pulse.data():null,
    patterns:patterns.exists?patterns.data():null, topics:topics.exists?topics.data():null,
    tracker: tr.filter(d=>d.exists).flatMap(d=>d.data().rows||[])};
  runChip(); render();
}
function runChip(){
  const el=$("#runChip"), m=S.meta;
  if(!m){ el.textContent="First run pending"; el.className="chip warn"; return; }
  const run = m.runs?.[S.date] || {};
  const failed = (run.failed_sources||[]).length;
  el.textContent = `${run.finished_ist ? "Run "+run.finished_ist : "Run done"} · ${failed ? failed+" sources failed" : "all sources OK"}`;
  el.className = "chip " + (failed>8 ? "bad" : failed ? "warn" : "ok");
  el.title = failed ? "Failed: "+run.failed_sources.join(", ") : "";
}

/* ---------- idea status ---------- */
async function setStatus(id, status, extra={}){
  const idea = S.ideas.find(i=>i._id===id); if(!idea) return;
  const history = [...(idea.history||[]), {status, at:new Date().toISOString()}];
  try{ await S.db.doc("ideas/"+id).update({status, history, updated_at:new Date().toISOString(), ...extra}); toast(`${id} → ${status}`); }
  catch(e){ toast(e.code==="invalid_argument" ? "You don't have edit access" : "Could not save. Try again."); }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const id=b.dataset.id, act=b.dataset.act, box=b.closest(".actions");
  if(act==="accept") setStatus(id,"Accepted");
  if(act==="prod") setStatus(id,"In production");
  if(act==="reopen") setStatus(id,"Suggested");
  if(act==="publish"){ const u=box.querySelector("input")?.value.trim(); if(!/^https?:\/\//.test(u||"")){ toast("Add the video link first"); box.querySelector("input")?.focus(); return; }
    setStatus(id,"Published",{published_url:u, published_at:new Date().toISOString()}); }
  if(act==="reject"){ const r=box.querySelector("input")?.value.trim(); if(!r){ toast("Add a short reason (the model learns from it)"); box.querySelector("input")?.focus(); return; }
    setStatus(id,"Rejected",{reject_reason:r}); }
  if(act==="copy"){ const txt=b.dataset.text; navigator.clipboard?.writeText(txt).then(()=>toast("Copied"),()=>toast("Copy blocked. Select the text and copy it.")); }
  if(act==="chan"){ S.chan=b.dataset.v; render(); }
  if(act==="pscope"){ S.pscope=b.dataset.v; render(); }
});

/* ---------- renderers ---------- */
function render(){
  const t=S.tab;
  if(t==="brief") renderBrief(); if(t==="tracker") renderTracker(); if(t==="channels") renderChannels();
  if(t==="web") renderWeb(); if(t==="calendar") renderCalendar(); if(t==="ledger") renderLedger(); if(t==="patterns") renderPatterns();
}
const vchip = v => v==="Verified" ? `<span class="chip ok">✓ Verified</span>` : v==="Avoid" ? `<span class="chip bad">⛔ Avoid</span>` : `<span class="chip warn">⚠ Needs check</span>`;
const schip = s => `<span class="chip ${s==="Published"?"ok":s==="Rejected"?"bad":s==="Suggested"?"":"warn"}">${esc(s||"Suggested")}</span>`;
function list(a){ return (a&&a.length) ? `<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : `<span class="muted">–</span>`; }
function actions(i){
  const s=i.status||"Suggested", id=esc(i._id);
  if(s==="Published") return `<div class="actions small"><span class="muted">Published</span> ${i.published_url?`<a href="${esc(i.published_url)}" target="_blank" rel="noopener">video ↗</a>`:""}</div>`;
  if(s==="Rejected") return `<div class="actions small"><span class="muted">Reason: ${esc(i.reject_reason||"–")}</span><button data-act="reopen" data-id="${id}">Reopen</button></div>`;
  return `<div class="actions">
    ${s==="Suggested"?`<button class="primary" data-act="accept" data-id="${id}">Accept</button>`:""}
    ${s!=="In production"?`<button data-act="prod" data-id="${id}">In production</button>`:""}
    <input type="url" id="pub-${id}" placeholder="YouTube link (after publishing)" aria-label="Published video link">
    <button data-act="publish" data-id="${id}">Mark published</button>
  </div>
  <div class="actions"><input type="text" id="rej-${id}" placeholder="Why reject? (short reason)" aria-label="Reject reason"><button data-act="reject" data-id="${id}">Reject</button></div>`;
}
function ideaCard(i){
  const f=i.format||{}, k=i.keywords||{};
  return `<article class="card" style="--c:var(--${(i.channel||"").toLowerCase()})">
    <div class="row"><span class="chip ${esc(i.channel)}">${esc(i.channel)}</span>${vchip(i.verification)}${schip(i.status)}<span class="score" title="Priority score">${esc(i.priority)}/100</span></div>
    <div class="ttl">${esc((i.titles||[])[0]||i.topic)}</div>
    <div class="small muted">${esc(f.type||"")}${f.length?" · "+esc(f.length):""} · Publish by <b>${esc(i.publish_by||"–")}</b> · ${esc(i.upload_slot||"")}</div>
    <details class="more"><summary>Full card</summary>
      <div class="kv">
        <div><span class="label">Why now (evidence)</span>${list(i.why_now)}</div>
        <div><span class="label">Hook (first 5 sec)</span>${esc(f.hook||"–")}</div>
        <div><span class="label">Outline</span>${(f.outline||[]).length?`<ol>${f.outline.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:"–"}</div>
        ${f.shorts?`<div><span class="label">Shorts</span>${list(f.shorts)}</div>`:""}
        <div><span class="label">Title options</span>${(i.titles||[]).map(t=>`<div class="row">${esc(t)} <button class="copy" data-act="copy" data-text="${esc(t)}">Copy</button></div>`).join("")}</div>
        <div><span class="label">Thumbnail brief</span>${esc(i.thumbnail||"–")}</div>
        <div><span class="label">Keywords</span>Primary: ${esc((k.primary||[]).join(", "))}<br>Secondary: ${esc((k.secondary||[]).join(", "))}</div>
        <div><span class="label">Description draft</span><pre>${esc(i.description||"–")}</pre><button class="copy" data-act="copy" data-text="${esc(i.description||"")}">Copy description</button></div>
        <div><span class="label">Tags</span>${esc((i.tags||[]).join(", "))} <button class="copy" data-act="copy" data-text="${esc((i.tags||[]).join(", "))}">Copy</button></div>
        <div><span class="label">Verification sources</span>${(i.sources||[]).length?`<ul>${i.sources.map(s=>`<li><a href="${esc(s.url||s)}" target="_blank" rel="noopener">${esc(s.title||s.url||s)}</a></li>`).join("")}</ul>`:"–"}</div>
        <div><span class="label">Risk flags</span>${esc(i.risk_flags||"none")}</div>
        <div class="small muted">ID ${esc(i._id)} · Topic cluster: ${esc(i.topic_cluster)}</div>
      </div>
    </details>
    ${actions(i)}
  </article>`;
}
function renderBrief(){
  const el=$("#tab-brief");
  if(!S.meta){ el.innerHTML=`<div class="empty"><h2>The first daily run hasn't happened yet</h2><p>Every morning by about 6:15 AM IST this page fills with the day's idea cards, the Top 500 and trends.</p></div>`; return; }
  const run=S.meta.runs?.[S.date]||{};
  const cal=(S.calendar?.upcoming||[]).filter(e=>e.days_left<=14);
  const day=S.ideas.filter(i=>i.date===S.date);
  const open=S.ideas.filter(i=>["Accepted","In production"].includes(i.status));
  el.innerHTML = `
  <div class="summary">
    <span class="label">${dshort(S.date)} · Summary</span>
    <p>${esc(run.summary || "No summary for this day.")}</p>
    ${cal.length?`<div class="alerts">${cal.map(e=>`<div class="alert ${e.days_left<=5?"hot":""}"><b>${e.days_left===0?"Today":e.days_left+" days"}</b> ${esc(e.name)} <span class="small muted">${e.channels.join(" · ")} · ${esc(e.stage)}</span></div>`).join("")}</div>`:""}
    ${open.length?`<div class="small muted">In progress: ${open.map(i=>`<b>${esc(i._id)}</b> (${esc(i.status)})`).join(", ")}</div>`:""}
  </div>
  <div class="cols">${["DEV","KID","TFN"].map(c=>{
    const cards=day.filter(i=>i.channel===c).sort((a,b)=>(b.priority||0)-(a.priority||0));
    return `<div class="col stack" data-ch="${c}"><div class="col-h"><h2>${CH[c]}</h2><span class="chip ${c}">${cards.length} ideas</span></div>
      ${cards.map(ideaCard).join("") || `<div class="empty small">No ideas for this day.</div>`}</div>`;}).join("")}</div>`;
}
function renderTracker(){
  const el=$("#tab-tracker"), rows=S.day.tracker||[];
  if(!rows.length){ el.innerHTML=`<div class="empty">No Top 500 data for this day.${S.day.loaded?"":" Loading…"}</div>`; return; }
  const cats=[...new Set(rows.map(r=>r.category).filter(Boolean))].sort(), langs=[...new Set(rows.map(r=>r.lang_detected))].sort();
  const lens=[...new Set(rows.map(r=>r.length_bucket))];
  const f=S.tf, q=f.q.toLowerCase();
  const out=rows.filter(r=>(!q||(r.title+" "+r.channel).toLowerCase().includes(q))&&(!f.cat||r.category===f.cat)&&(!f.lang||r.lang_detected===f.lang)
     &&(!f.fmt||(f.fmt==="short")===!!r.short)&&(!f.len||r.length_bucket===f.len));
  const opt=(arr,sel,lab)=>`<option value="">${lab}</option>`+arr.map(a=>`<option ${a===sel?"selected":""} value="${esc(a)}">${esc(LANG[a]||a)}</option>`).join("");
  el.innerHTML=`<div class="filters">
    <input type="search" id="tq" placeholder="Search title or channel" value="${esc(f.q)}" aria-label="Search">
    <select id="tcat" aria-label="Category">${opt(cats,f.cat,"All categories")}</select>
    <select id="tlang" aria-label="Language">${opt(langs,f.lang,"All languages")}</select>
    <select id="tfmt" aria-label="Format"><option value="">Short + Long</option><option value="short" ${f.fmt==="short"?"selected":""}>Shorts only</option><option value="long" ${f.fmt==="long"?"selected":""}>Long-form only</option></select>
    <select id="tlen" aria-label="Length">${opt(lens,f.len,"Any length")}</select>
    <span class="small muted num">${out.length} / ${rows.length}</span></div>
  <div class="tablebox"><table><thead><tr><th class="r">#</th><th>Video</th><th class="r" title="Views gained in last 24h (estimate on first day)">24h views</th><th class="r">Total</th><th class="r">Per hour</th><th>Length</th><th>Lang</th><th>Category</th></tr></thead>
  <tbody>${out.slice(0,500).map(r=>`<tr><td class="r num">${r.rank??""}</td>
    <td class="tt"><a href="${yt(r.id)}" target="_blank" rel="noopener">${esc(r.title)}</a><div class="small muted">${esc(r.channel)}${r.age_h?` · ${r.age_h<48?Math.round(r.age_h)+"h":Math.round(r.age_h/24)+"d"} old`:""}</div></td>
    <td class="r num">${fmt(r.views_24h ?? r.est_24h)}${r.views_24h==null?"<span class='muted' title='Estimate'>*</span>":""}</td><td class="r num">${fmt(r.views)}</td><td class="r num">${fmt(r.velocity_h)}</td>
    <td>${r.short?"<span class='chip'>Short</span>":esc(dur(r.duration_s))}</td><td>${esc(LANG[r.lang_detected]||r.lang_detected)}</td><td class="small">${esc(r.category)}</td></tr>`).join("")}</tbody></table></div>
  <p class="small muted">* Estimated for videos seen for the first time (views ÷ age). From the next day the real 24-hour gain is shown.</p>`;
  const bind=(id,k)=>$("#"+id).addEventListener(id==="tq"?"input":"change",e=>{S.tf[k]=e.target.value; renderTracker(); if(id==="tq"){const i=$("#tq"); i.focus(); i.setSelectionRange(i.value.length,i.value.length);} });
  bind("tq","q");bind("tcat","cat");bind("tlang","lang");bind("tfmt","fmt");bind("tlen","len");
}
function vidList(arr, metric){
  if(!arr||!arr.length) return `<p class="muted small">No data.</p>`;
  return `<ul class="list">${arr.slice(0,15).map(v=>`<li><span class="big">${metric==="outlier"?(v.outlier??"–")+"×":fmt(v.velocity_h)+"/h"}</span>
    <span><a href="${yt(v.id)}" target="_blank" rel="noopener">${esc(v.title)}</a><br><span class="small muted">${esc(v.channel)} · ${fmt(v.views)} views · ${v.short?"Short":dur(v.duration_s)}${v.query?" · “"+esc(v.query)+"”":""}</span></span></li>`).join("")}</ul>`;
}
function renderChannels(){
  const el=$("#tab-channels"), a=S.day.areas, c=S.chan;
  const seg=`<div class="seg" role="group" aria-label="Channel">${Object.keys(CH).map(k=>`<button data-act="chan" data-v="${k}" aria-pressed="${k===c}">${CH[k]}</button>`).join("")}</div>`;
  if(!a){ el.innerHTML=seg+`<div class="empty" style="margin-top:12px">No channel data for this day.</div>`; return; }
  const topics=(S.day.topics?.[c]||[]);
  const kw=(a.rising_keywords?.[c]||[]);
  el.innerHTML=`${seg}<div class="stack" style="margin-top:14px">
   <div class="panel"><h2>Rising topics</h2>${topics.length?`<ul class="list">${topics.map(t=>`<li><span class="big">${esc(t.score)}</span><span><b>${esc(t.name)}</b><br><span class="small muted">${esc(t.evidence)}</span></span></li>`).join("")}</ul>`:`<p class="muted small">Topics are written by the daily run.</p>`}</div>
   <div class="grid2">
    <div class="panel"><h2>Outliers</h2><p class="small muted">How far above the channel's own median (uploads from the last 14 days)</p>${vidList(a[c]?.outliers,"outlier")}</div>
    <div class="panel"><h2>Fast-rising new videos</h2><p class="small muted">Keyword search, last 72 hours</p>${vidList(a[c]?.fast_new,"vel")}</div>
   </div>
   <div class="panel"><h2>Search suggestions</h2><p class="small muted">YouTube autocomplete. <b>New</b> = not there yesterday.</p>
    ${kw.length?`<ul class="list">${kw.map(k=>`<li><span class="big">${k.new_suggestions?"New":""}</span><span><b>${esc(k.keyword)}</b><br><span class="small muted">${esc((k.new_suggestions||k.suggestions||[]).join(" · "))}</span></span></li>`).join("")}</ul>`:`<p class="muted small">No data.</p>`}</div>
  </div>`;
}
function renderWeb(){
  const el=$("#tab-web"), p=S.day.pulse;
  if(!p){ el.innerHTML=`<div class="empty">No web data for this day.</div>`; return; }
  const H=p.headlines||{}, groups=[["TFN","Finance/Tech India (Google News)"],["tech_india","Tech & money (India)"],["tech_usa","Tech USA"],["tech_china","Tech China"],["tech_global","Tech global"],["official","Official (RBI/SEBI/PIB)"],["fact_check","Fact-check"],["DEV","Devotional news"],["KID","Kids / education"],["GENERAL","General"]];
  const hl=(g,t)=>(H[g]||[]).length?`<div class="panel"><h3>${t}</h3><ul class="list">${H[g].slice(0,10).map(h=>`<li><span></span><span><a href="${esc(h.link)}" target="_blank" rel="noopener">${esc(h.title)}</a><br><span class="small muted">${esc(h.source)}</span></span></li>`).join("")}</ul></div>`:"";
  el.innerHTML=`<div class="grid2">
    <div class="panel"><h2>Google Trends India</h2><ul class="list">${(p.google_trends||[]).slice(0,20).map(t=>`<li><span class="big">${esc(t.traffic||"")}</span><span>${esc(t.q)}${t.news?`<br><span class="small muted">${esc(t.news)}</span>`:""}</span></li>`).join("")||"<li class='muted'>No data</li>"}</ul></div>
    <div class="panel"><h2>X (Twitter) trends</h2><ul class="list">${(p.x_trends||[]).slice(0,20).map(t=>`<li><span class="big">${t.hours_trending||""}h</span><span>${esc(t.topic)} ${t.new_today?"<span class='chip warn'>new</span>":""}</span></li>`).join("")||"<li class='muted'>No data</li>"}</ul></div>
    <div class="panel"><h2>YouTube India music chart</h2><ul class="list">${(p.kworb_top20||[]).map(k=>`<li><span class="big">#${esc(k.pos)}</span><span>${esc(k.track)}<br><span class="small muted">${esc(k.weekly_views)} weekly · ${esc(k.weeks)} wks</span></span></li>`).join("")||"<li class='muted'>No data</li>"}</ul></div>
    <div class="panel"><h2>Reddit (top today)</h2>${Object.entries(p.reddit||{}).filter(([,v])=>v.length).map(([s,v])=>`<div><span class="label">r/${esc(s)}</span><ul class="list">${v.slice(0,4).map(t=>`<li><span></span><span class="small">${esc(t)}</span></li>`).join("")}</ul></div>`).join("")||"<p class='muted small'>No data</p>"}</div>
    ${groups.map(([g,t])=>hl(g,t)).join("")}
  </div>
  ${(p.failed_sources||[]).length?`<p class="small muted">Sources that failed in this run: ${esc(p.failed_sources.join(", "))}</p>`:""}`;
}
function renderCalendar(){
  const el=$("#tab-calendar"), c=S.calendar;
  if(!c){ el.innerHTML=`<div class="empty">Calendar not loaded yet.</div>`; return; }
  el.innerHTML=`<div class="grid2"><div class="stack"><h2>Next 45 days</h2><div class="cal">${c.upcoming.map(e=>{const d=new Date(e.date+"T00:00:00");
    return `<div class="ev"><div class="d">${d.getDate()}<small>${d.toLocaleDateString("en-IN",{month:"short"})}</small></div>
    <div><b>${esc(e.name)}</b><div class="small muted">${e.channels.map(x=>`<span class="chip ${x}">${x}</span>`).join(" ")} · Production deadline ${dshort(e.production_deadline)}${e.note?" · "+esc(e.note):""}</div></div>
    <span class="chip ${e.days_left<=5?"bad":e.days_left<=14?"warn":""}">${e.days_left===0?"Today":e.days_left+" days"} · ${esc(e.stage)}</span></div>`}).join("")}</div></div>
    <div class="stack"><h2>Deity days, next 7 days</h2><div class="panel"><ul class="list">${c.next_7_days_deity.map(w=>`<li><span class="big">${dshort(w.date)}</span><span><b>${esc(w.weekday)}</b> · ${esc(w.deity)}</span></li>`).join("")}</ul>
    <p class="small muted">Deity-day videos should be live the night before or by 5–7 AM that morning.</p></div>
    <p class="small muted">Dates come from one source. When an event reaches the Brief stage (14 days out) the daily run re-checks it against Drik Panchang.</p></div></div>`;
}
function renderLedger(){
  const el=$("#tab-ledger"), f=S.lf;
  let rows=S.ideas.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.priority||0)-(a.priority||0));
  if(f.ch) rows=rows.filter(i=>i.channel===f.ch);
  if(f.st==="open") rows=rows.filter(i=>["Suggested","Accepted","In production"].includes(i.status||"Suggested"));
  else if(f.st) rows=rows.filter(i=>(i.status||"Suggested")===f.st);
  const counts=STATUS.map(s=>[s,S.ideas.filter(i=>(i.status||"Suggested")===s).length]);
  el.innerHTML=`<div class="filters">
    <select id="lch" aria-label="Channel"><option value="">All channels</option>${Object.entries(CH).map(([k,v])=>`<option value="${k}" ${f.ch===k?"selected":""}>${v}</option>`).join("")}</select>
    <select id="lst" aria-label="Status"><option value="open" ${f.st==="open"?"selected":""}>Open (suggested + in progress)</option><option value="" ${f.st===""?"selected":""}>All</option>${STATUS.map(s=>`<option ${f.st===s?"selected":""}>${s}</option>`).join("")}</select>
    <span class="small muted">${counts.map(([s,n])=>`${s}: <b class="num">${n}</b>`).join(" · ")}</span></div>
    ${rows.length?`<div class="tablebox"><table><thead><tr><th>Date</th><th>ID</th><th>Idea</th><th>Status</th><th class="r">Score</th><th>Cooldown until</th></tr></thead><tbody>
    ${rows.map(i=>`<tr><td class="num small">${esc(i.date)}</td><td class="num small">${esc(i._id)}</td><td class="tt"><b>${esc((i.titles||[])[0]||i.topic)}</b><div class="small muted">${esc(i.topic_cluster)}</div></td>
    <td>${schip(i.status)} ${vchip(i.verification)}</td><td class="r num">${esc(i.priority)}</td><td class="num small">${esc(i.cooldown_until||"–")}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No ideas.</div>`}
    <p class="small muted">Change status from the cards in Today's Brief. Published and rejected ideas are not suggested again until their cooldown ends.</p>`;
  $("#lch").onchange=e=>{S.lf.ch=e.target.value;renderLedger()}; $("#lst").onchange=e=>{S.lf.st=e.target.value;renderLedger()};
}
function renderPatterns(){
  const el=$("#tab-patterns"), P=S.day.patterns;
  const scopes={tracker_top500:"Top 500 (all India)",area_DEV:"Devotional",area_KID:"Kids",area_TFN:"Tech + Finance"};
  const seg=`<div class="seg" role="group" aria-label="Scope">${Object.entries(scopes).map(([k,v])=>`<button data-act="pscope" data-v="${k}" aria-pressed="${k===S.pscope}">${v}</button>`).join("")}</div>`;
  const p=P?.[S.pscope];
  if(!p||!p.n){ el.innerHTML=seg+`<div class="empty" style="margin-top:12px">No pattern data for this view.</div>`; return; }
  const maxMed=Math.max(...Object.values(p.length).map(v=>v.median_24h),1);
  const hrs=Array.from({length:24},(_,h)=>p.publish_hour_ist?.[h]||0), hmax=Math.max(...hrs,1);
  const pct=x=>Math.round(x*100)+"%";
  el.innerHTML=`${seg}<div class="grid2" style="margin-top:14px">
   <div class="panel"><h2>Length vs views</h2><p class="small muted">Bar = median 24h views. Share = portion of videos at this length. (n=${p.n})</p>
     ${Object.entries(p.length).map(([b,v])=>`<div class="bar"><span>${esc(b)}</span><div class="track"><div class="fill" style="width:${Math.round(v.median_24h/maxMed*100)}%"></div></div><span class="num r">${fmt(v.median_24h)} · ${pct(v.share)}</span></div>`).join("")}
     <p class="small">Shorts share: <b class="num">${pct(p.shorts_share)}</b> · Median engagement: <b class="num">${(p.median_engagement*100).toFixed(2)}%</b></p></div>
   <div class="panel"><h2>Upload time (IST)</h2><p class="small muted">Hour of publishing for videos uploaded in the last 7 days</p>
     <div class="hours" aria-label="Uploads per hour">${hrs.map((n,h)=>`<div title="${h}:00 – ${n} videos" style="height:${Math.round(n/hmax*100)}%"></div>`).join("")}</div>
     <div class="hours-x">${hrs.map((_,h)=>`<span>${h%3===0?h:""}</span>`).join("")}</div></div>
   <div class="panel"><h2>Title patterns</h2>${Object.entries({has_number:"Has a number",question:"Question (kya/kaise/?)",devanagari:"Devanagari script",emoji:"Emoji",all_caps_word:"CAPS word",pipe_or_dash:"| or - separator"}).map(([k,v])=>`<div class="bar"><span>${v}</span><div class="track"><div class="fill" style="width:${pct(p.title[k])}"></div></div><span class="num r">${pct(p.title[k])}</span></div>`).join("")}
     <p class="small muted">Median title length: <b class="num">${p.title_len_median}</b> characters</p></div>
   <div class="panel"><h2>Language mix</h2>${Object.entries(p.language_share).slice(0,8).map(([k,v])=>`<div class="bar"><span>${esc(LANG[k]||k)}</span><div class="track"><div class="fill" style="width:${pct(v)}"></div></div><span class="num r">${pct(v)}</span></div>`).join("")}</div>
  </div>`;
}
boot();
</script>
