<style>

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:14px;z-index:9}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}

  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-12px 0 32px rgba(0,0,0,.18)}
.drawer-h{display:flex;flex-shrink:0;justify-content:space-between;align-items:center;padding:16px 18px 8px}

<script>
const CH = {DEV:"Devotional", KID:"Kids", TFN:"Tech + Finance"};
const STATUS = ["Suggested","Accepted","In production","Published","Rejected","Expired"];
const TRIGGER_ID = "trig_01Ty8RSQjvVLoNjbyzBsyi8J", MCP_SERVER = "Claude Code Remote";
const S = {openBox:{}, openRefine:null, lopen:new Set(), mcp:null, requests:[], lastReq:null, db:null, meta:null, date:null, ideas:[], day:{}, calendar:null, tab:"brief", chan:"DEV", pscope:"tracker_top500",
           tf:{q:"",cat:"",lang:"",fmt:"",len:""}, lf:{ch:"",st:"open"}};
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fmt(n){ if(n==null||isNaN(n)) return "–"; const a=Math.abs(n);
  if(a>=1e7) return (n/1e7).toFixed(a>=1e8?0:1)+" Cr"; if(a>=1e5) return (n/1e5).toFixed(a>=1e6?0:1)+" L";
  if(a>=1e3) return (n/1e3).toFixed(a>=1e4?0:1)+"K"; return String(Math.round(n)); }
function dur(s){ if(!s) return "–"; const m=Math.floor(s/60), h=Math.floor(m/60); return h? `${h}h ${m%60}m` : `${m}:${String(s%60).padStart(2,"0")}`; }
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2200); }
function dshort(iso){ const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"}); }
const yt = id => `https://www.youtube.com/watch?v=${encodeURIComponent(id)}`;
const LANG = {hi:"Hindi",latin:"Eng/Hinglish",en:"English",ta:"Tamil",te:"Telugu",kn:"Kannada",ml:"Malayalam",bn:"Bengali",pa:"Punjabi",gu:"Gujarati",mr:"Marathi",or:"Odia",ur:"Urdu"};

/* ---------- tabs ---------- */
$("#tabs").addEventListener("click", e => { const b=e.target.closest("button[data-tab]"); if(!b) return; setTab(b.dataset.tab); });
function setTab(t){ S.tab=t; document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===t));
  document.querySelectorAll("main > section").forEach(s=>s.hidden = s.id!=="tab-"+t); try{localStorage.setItem("rtd.tab",t)}catch(e){} render(); }
$("#dateSel").addEventListener("change", e => loadDay(e.target.value));

/* ---------- data ---------- */
async function boot(){
  try{ const t=localStorage.getItem("rtd.tab"); if(t && $("#tab-"+t)) S.tab=t; }catch(e){}
  setTab(S.tab);
  const db = window.claude?.use ? await window.claude.use("db") : null;
  if(!db){ $("#runChip").textContent="Database not available in this view"; $("#runChip").className="chip bad"; render(); return; }
  S.db = db;
  window.claude.use("mcp").then(m=>{ S.mcp=m; render(); }).catch(()=>{});
  db.collection("requests").onSnapshot(snap => { S.requests = snap.docs.map(d=>({_id:d.id, ...d.data()})); render(); },
    err => toast("Your ideas could not load ("+err.code+")"));
  db.collection("runs").orderBy("date","desc").limit(60).onSnapshot(snap => {
    const runs = snap.docs.map(d=>d.data());
    S.meta = runs.length ? {runs:Object.fromEntries(runs.map(r=>[r.date,r])), dates:runs.map(r=>r.date)} : null;
    const dates = (S.meta?.dates || []).slice().sort().reverse();
    $("#dateSel").innerHTML = dates.map(d=>`<option value="${d}">${dshort(d)} ${d===dates[0]?"(latest)":""}</option>`).join("") || `<option>No runs yet</option>`;
    const want = S.date && dates.includes(S.date) ? S.date : dates[0];
    if(want){ $("#dateSel").value = want; if(want!==S.date || !S.day.loaded) loadDay(want); }
    runChip(); render();
  }, err => { $("#runChip").textContent="Could not load: "+err.code; $("#runChip").className="chip bad"; });
  db.collection("ideas").onSnapshot(snap => { S.ideas = snap.docs.map(d=>({_id:d.id, ...d.data()})); render(); },
    err => toast("Ideas could not load ("+err.code+")"));
  db.collection("calendar").orderBy("date","desc").limit(1).onSnapshot(snap => { S.calendar = snap.empty ? null : snap.docs[0].data(); render(); });
}
async function loadDay(date){
  S.date=date; S.day={loaded:false};
  const db=S.db, parts=[1,2,3,4,5];
  const [areas,pulse,patterns,topics,...tr] = await Promise.all([
    db.doc(`areas/${date}`).get(), db.doc(`pulse/${date}`).get(), db.doc(`patterns/${date}`).get(), db.doc(`topics/${date}`).get(),
    ...parts.map(p=>db.doc(`tracker/${date}_${p}`).get())
  ].map(p=>p.catch(()=>({exists:false}))));
  if(S.date!==date) return;
  S.day = {loaded:true, areas:areas.exists?areas.data():null, pulse:pulse.exists?pulse.data():null,
    patterns:patterns.exists?patterns.data():null, topics:topics.exists?topics.data():null,
    tracker: tr.filter(d=>d.exists).flatMap(d=>d.data().rows||[])};
  runChip(); render();
}
function runChip(){
  const el=$("#runChip"), m=S.meta;
  if(!m){ el.textContent="First run pending"; el.className="chip warn"; return; }
  const run = m.runs?.[S.date] || {};
  const failed = (run.failed_sources||[]).length;
  el.textContent = `${run.finished_ist ? "Run "+run.finished_ist : "Run done"} · ${failed ? failed+" sources failed" : "all sources OK"}`;
  el.className = "chip " + (failed>8 ? "bad" : failed ? "warn" : "ok");
  el.title = failed ? "Failed: "+run.failed_sources.join(", ") : "";
}

/* ---------- idea status ---------- */
async function setStatus(id, status, extra={}){
  const idea = S.ideas.find(i=>i._id===id); if(!idea) return;
  const history = [...(idea.history||[]), {status, at:new Date().toISOString()}];
  try{ await S.db.doc("ideas/"+id).update({status, history, updated_at:new Date().toISOString(), ...extra}); S.openBox[id]=undefined; toast(`${id} → ${SLABEL[status]||status}`); }
  catch(e){ toast(e.code==="invalid_argument" ? "You don't have edit access" : "Could not save. Try again."); }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const id=b.dataset.id, act=b.dataset.act, box=b.closest(".actions");
  if(act==="accept") setStatus(id,"Accepted");
  if(act==="prod") setStatus(id,"In production");
  if(act==="reopen") setStatus(id,"Suggested");
  if(act==="publish"){ const u=box.querySelector("input")?.value.trim(); if(!/^https?:\/\//.test(u||"")){ toast("Add the video link first"); box.querySelector("input")?.focus(); return; }
    setStatus(id,"Published",{published_url:u, published_at:new Date().toISOString()}); }
  if(act==="reject"){ const r=box.querySelector("input")?.value.trim(); if(!r){ toast("Add a short reason (the model learns from it)"); box.querySelector("input")?.focus(); return; }
    setStatus(id,"Rejected",{reject_reason:r}); }
  if(act==="copy"){ const txt=b.dataset.text; navigator.clipboard?.writeText(txt).then(()=>toast("Copied"),()=>toast("Copy blocked. Select the text and copy it.")); }
  if(act==="chan"){ S.chan=b.dataset.v; render(); }
  if(act==="box"){ S.openBox[id]=b.dataset.box||undefined; render(); setTimeout(()=>document.getElementById((b.dataset.box==="rej"?"rej-":"pub-")+id)?.focus(),30); }
  if(act==="lexp"){ const id=b.dataset.id; S.lopen.has(id)?S.lopen.delete(id):S.lopen.add(id); renderLedger(); }
  if(act==="pscope"){ S.pscope=b.dataset.v; render(); }
});

function render(){

const vchip = v => v==="Verified" ? `<span class="chip ok">✓ Verified</span>` : v==="Avoid" ? `<span class="chip bad">⛔ Avoid</span>` : `<span class="chip warn">⚠ Needs check</span>`;

const schip = s => `<span class="chip ${s==="Published"?"ok":s==="Rejected"?"bad":s==="Suggested"?"":"warn"}">${esc(SLABEL[s]||s||"Suggested")}</span>`;
/* tolerate the shapes different runs write: array, single string, or object */
const arr = x => Array.isArray(x) ? x : (x==null || x==="" ? [] : (typeof x==="object" ? Object.values(x) : [x]));
const txt = x => typeof x==="string" ? x : (x==null ? "" : (x.title || x.text || JSON.stringify(x)));
function list(a){ a=arr(a); return a.length ? `<ul>${a.map(x=>`<li>${esc(txt(x))}</li>`).join("")}</ul>` : `<span class="muted">–</span>`; }
const RLABEL={Queued:"Queued",Researching:"Running",Ready:"Completed",Failed:"Failed"};
const RCLASS={Queued:"",Researching:"warn",Ready:"ok",Failed:"bad"};
const rchip = st => `<span class="chip ${RCLASS[st]||""}">${esc(RLABEL[st]||st||"Queued")}</span>`;
function reqsFor(i){ return S.requests.filter(r=>r.idea_id===i._id || (i.request_id && r._id===i.request_id)).sort((a,b)=>(a.created_at||"").localeCompare(b.created_at||"")); }
function actions(i){
  const s=i.status||"Suggested", id=esc(i._id), box=S.openBox[i._id];

  else if(s==="Rejected") inner=`<div class="actions small"><span class="chip bad">Rejected</span><span class="muted">${esc(i.reject_reason||"")}</span><button data-act="reopen" data-id="${id}">Reopen</button></div>`;
  else inner=`<div class="actions">
      ${s==="Suggested"?`<button data-act="accept" data-id="${id}" title="Reserve it: it won't be suggested again while you make it">Accept</button>`:`<span class="chip warn">Planned</span>`}
      <button data-act="box" data-box="rej" data-id="${id}" aria-expanded="${box==="rej"}">Reject</button>
      <button data-act="box" data-box="pub" data-id="${id}" aria-expanded="${box==="pub"}">Published</button></div>
    ${box==="rej"?`<div class="actions"><input type="text" id="rej-${id}" placeholder="Why reject? (short reason)" aria-label="Reject reason"><button class="primary" data-act="reject" data-id="${id}">Confirm reject</button><button data-act="box" data-box="" data-id="${id}">Cancel</button></div>`:""}
    ${box==="pub"?`<div class="actions"><input type="url" id="pub-${id}" placeholder="YouTube video link" aria-label="Published video link"><button class="primary" data-act="publish" data-id="${id}">Save</button><button data-act="box" data-box="" data-id="${id}">Cancel</button></div>`:""}`;
  const open=S.requests.find(r=>r.type==="refine" && r.idea_id===i._id && ["Queued","Researching"].includes(r.status));
  const refine = open
    ? `<div class="small refine-run">${rchip(open.status)} ${i.origin==="Mudit"?"Refining":"Making a new card"} with: “${esc(open.instructions||"")}”</div>`
    : `<details class="refine"${S.openRefine===i._id?" open":""}><summary>Refine & research again</summary>

  return `<details class="actions-menu"${box?" open":""}><summary>Actions</summary><div class="act-wrap">${inner}</div></details>${refine}`;
}
function researchLog(i){
  const rs=reqsFor(i);
  const rows=[];
  if(i.origin!=="Mudit") rows.push(`<li><span class="chip ok">Completed</span> <b>Daily brief</b> <span class="small muted num">${esc(i.date||"")}</span><div class="small">Input: the day's trend data (YouTube, Google Trends, X, news) and the calendar.</div></li>`);
  rs.forEach(r=>rows.push(`<li>${rchip(r.status)} <b>${r.type==="refine"?"Refinement":"Your idea"}</b> <span class="small muted num">${esc((r.created_at||"").slice(0,16).replace("T"," "))}</span>
     <div class="small">Input: “${esc(r.type==="refine"?r.instructions:r.idea)}”${r.angle?` · Angle: ${esc(r.angle)}`:""}${r.links?` · Links: ${esc(r.links)}`:""}</div>
     ${r.summary?`<div class="small"><b>Result:</b> ${esc(r.summary)}</div>`:""}${r.new_idea_id&&r.new_idea_id!==i._id?`<div class="small"><b>New card:</b> ${esc(r.new_idea_id)} (in My Ideas)</div>`:""}${r.status==="Failed"?`<div class="small" style="color:var(--bad)"><b>Why it failed:</b> ${esc(r.error||"")}</div>`:""}</li>`));
  const kids=S.ideas.filter(x=>x.derived_from===i._id);
  const variants=kids.length?`<div><span class="label">Your variants of this suggestion</span><ul>${kids.map(x=>`<li><b>${esc(x._id)}</b> — ${esc(txt(arr(x.titles)[0])||x.topic)}</li>`).join("")}</ul></div>`:"";
  const parent=i.derived_from?`<div><span class="label">Made from</span>Daily suggestion ${esc(i.derived_from)} (left unchanged)</div>`:"";
  return (rows.length?`<div><span class="label">Research history</span><ul class="rlog">${rows.join("")}</ul></div>`:"")+parent+variants;
}
function ideaCard(i){

        ${researchLog(i)}${revs.length?`<div><span class="label">What changed in each refinement</span><ul>${revs.map(r=>`<li><span class="small muted num">${esc(String(r.at||"").slice(0,16).replace("T"," "))}</span> <b>You asked:</b> ${esc(r.instructions||"")}${r.changes?`<br><span class="small"><b>Changed:</b> ${esc(r.changes)}</span>`:""}</li>`).join("")}</ul></div>`:""}

    </details>

async function startResearch(id, kind="Research"){
  const ref=S.db.doc("requests/"+id);
  if(!S.mcp){ await ref.update({dispatch_note:"Will be researched in the next morning brief."}).catch(()=>{}); return; }
  try{
    await S.mcp.callTool(MCP_SERVER,"fire_trigger",{trigger_id:TRIGGER_ID, text:`${kind} request ${id}`});
    await ref.update({dispatch_note:"Research started — you'll get a notification when the card is ready."}).catch(()=>{});
    toast("Research started");
  }catch(err){
    const msg={server_not_connected:"Claude Code Remote isn't connected, so it will run in the next morning brief.",
      needs_reauth:"Reconnect Claude Code Remote in claude.ai Settings → Connectors. Queued for the morning brief meanwhile.",
      not_in_manifest:"Instant research is turned off for this page. Queued for the morning brief.",
      blocked_by_policy:"Your organization blocks instant research. Queued for the morning brief.",
      tool_error:"The research task couldn't start ("+(err.message||"error")+"). Queued for the morning brief."}[err.code]
      || "Couldn't confirm the research started. If no card appears in 30 minutes, press Research now.";
    await ref.update({dispatch_note:msg}).catch(()=>{});
    toast(msg);
  }
}
