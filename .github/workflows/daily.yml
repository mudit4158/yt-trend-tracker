name: daily-collect

on:
  schedule:
    # GitHub starts scheduled jobs late when its queue is busy (27 Sep 2026: 04:37 IST job started ~06:49).
    # So: main run 01:43 IST (20:13 UTC) with a ~4h buffer before the 05:52 IST brief,
    # plus a backup at 03:43 IST (22:13 UTC) that does nothing if today's data already exists.
    - cron: "13 20 * * *"
    - cron: "13 22 * * *"
  workflow_dispatch:
    inputs:
      rediscover:
        description: "Rebuild the channel watchlist now"
        type: boolean
        default: false
  push:
    paths:
      - "trigger/**"

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python collector/collect.py ${{ inputs.rediscover && '--rediscover' || '' }}
      - name: Analyze
        run: python analyzer/analyze.py
      - name: Prune raw snapshots older than 21 days
        run: python analyzer/prune.py 21
      - name: Commit data
        run: |
          git config user.name "yt-trend-bot"
          git config user.email "yt-trend-bot@users.noreply.github.com"
          git add -A data config/watchlist_resolved.json || true
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase --autostash
          git push
